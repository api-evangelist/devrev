aid: devrev
name: Devrev
description: >-
  DevRev is an AI-native platform that unifies customer support, product
  development, and analytics on a single knowledge graph connecting end users
  (Rev), builders (Dev), and their work. Its REST API is organized around
  resource-oriented URLs, accepts and returns JSON, and uses standard HTTP verbs
  and status codes. Endpoints cover works (issues and tickets), parts (the
  product hierarchy), accounts, articles and the knowledge base, conversations
  and timeline entries, tags, schedules, SLAs, surveys, webhooks, and snap-ins
  (custom automations and apps that extend the platform). Authentication uses
  Personal Access Tokens (PATs) passed as a Bearer token, and both a stable
  Public API and an early-access Beta API are published. DevRev also ships
  first-party SDKs, a Go-based CLI, the embeddable PLuG support widget, and
  Airdrop (ADaaS) data-sync tooling.
